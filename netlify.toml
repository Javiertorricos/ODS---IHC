# Netlify publica SOLO el frontend (carpeta biblioteca/frontend). La API va aparte (Render): localhost no sirve en internet.
[build]
  base = "biblioteca/frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Cabeceras básicas de seguridad
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
