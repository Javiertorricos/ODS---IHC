<meta charset="utf-8"><title>Biblioteca en 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Concepto: el recorrido real de un campus (pasillo de ladrillo, puerta de vidrio, sala con sillas amarillas)
   hasta una pantalla donde corre la biblioteca. La cámara avanza con el scroll. */
:root {
  --ink: #17181a;
  --paper: #fbfbf8;
  --paper-2: #eeeee8;
  --brick: #a8472b;
  --lib: #f2b705;
  --lib-ink: #3b2d00;
  --muted: #5b5f63;
  --line: rgba(23, 24, 26, .14);
  --ground: #dde6ea;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { scroll-behavior: auto; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow-x: hidden;
}
#track { height: 1600vh; }
#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; }

/* ---- barra de avance ---- */
#barra { position: fixed; left: 0; right: 0; top: env(safe-area-inset-top, 0px); height: 4px; background: rgba(23,24,26,.12); z-index: 5; }
#barra i { display: block; height: 100%; width: 100%; background: var(--lib); transform-origin: 0 50%; transform: scaleX(0); }

/* ---- marca ---- */
#marca { position: fixed; z-index: 4; top: calc(env(safe-area-inset-top, 0px) + 16px); left: max(16px, env(safe-area-inset-left, 0px)); display: flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 800; font-size: 15px; letter-spacing: -.01em; background: rgba(251,251,248,.9); padding: 6px 12px 6px 6px; border-radius: 999px; border: 1px solid var(--line); backdrop-filter: blur(8px); }
#marca b { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 8px; background: var(--ink); color: #fff; font-size: 15px; }

/* ---- capítulos (navegación lateral) ---- */
#pista { position: fixed; z-index: 4; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); transform: translateX(-50%); width: 26px; color: #fff; filter: drop-shadow(0 1px 6px rgba(0,0,0,.55)); transition: opacity .5s ease; pointer-events: none; }
#pista.fuera { opacity: 0; }
#pista .rueda { animation: rueda 1.5s ease-in-out infinite; }
@keyframes rueda { 0% { transform: translateY(0); opacity: 1; } 70% { transform: translateY(8px); opacity: 0; } 100% { opacity: 0; } }
#nav { position: fixed; z-index: 4; right: max(14px, env(safe-area-inset-right, 0px)); top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 4px; margin: 0; padding: 0; list-style: none; }
#nav button { all: unset; cursor: pointer; display: flex; align-items: center; justify-content: flex-end; gap: 10px; padding: 7px 4px; font-size: 12px; font-weight: 600; color: var(--ink); }
#nav button span { opacity: 0; transform: translateX(6px); transition: opacity .2s, transform .2s; background: var(--paper); padding: 3px 8px; border-radius: 6px; border: 1px solid var(--line); white-space: nowrap; }
#nav button:hover span, #nav button:focus-visible span, #nav button[aria-current="true"] span { opacity: 1; transform: none; }
#nav button::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: rgba(23,24,26,.28); border: 2px solid var(--paper); box-shadow: 0 0 0 1px var(--line); transition: transform .25s, background .25s; }
#nav button[aria-current="true"]::after { background: var(--lib); transform: scale(1.35); }
#nav button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; border-radius: 6px; }

/* ---- tarjetas de texto ---- */
#vineta { position: fixed; inset: 0; z-index: 1; pointer-events: none; background: radial-gradient(ellipse at 50% 45%, transparent 52%, rgba(24, 18, 12, .30) 100%), linear-gradient(to bottom, rgba(24,18,12,.10), transparent 14%); }
#textos { position: fixed; inset: 0; z-index: 3; pointer-events: none; }
.cap {
  position: absolute;
  left: max(16px, env(safe-area-inset-left, 0px));
  bottom: calc(max(20px, env(safe-area-inset-bottom, 0px)) + 8px);
  width: min(440px, calc(100vw - 32px));
  background: rgba(251,251,248,.93);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 20px 22px 22px;
  backdrop-filter: blur(10px);
  box-shadow: 0 18px 50px -20px rgba(23,24,26,.45);
  visibility: hidden;
  opacity: 0;
  transform: translateY(26px);
  transition: opacity .45s ease, transform .55s cubic-bezier(.2,.7,.2,1), visibility 0s .55s;
  pointer-events: none;
}
.cap.on { visibility: visible; opacity: 1; transform: none; transition-delay: 0s; pointer-events: auto; }
.cap > * { opacity: 0; transform: translateY(14px); transition: opacity .5s ease, transform .6s cubic-bezier(.2,.7,.2,1); }
.cap.on > * { opacity: 1; transform: none; }
.cap.on > :nth-child(1) { transition-delay: .08s; }
.cap.on > :nth-child(2) { transition-delay: .16s; }
.cap.on > :nth-child(3) { transition-delay: .24s; }
.cap.on > :nth-child(4) { transition-delay: .32s; }
.eyebrow { display: inline-block; margin: 0 0 10px; padding: 3px 9px; background: var(--lib); color: var(--lib-ink); font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; border-radius: 4px; }
.cap h2 { margin: 0 0 8px; font-family: var(--display); font-weight: 800; font-size: clamp(1.6rem, 4.2vw, 2.15rem); line-height: 1.05; letter-spacing: -.02em; text-wrap: balance; }
.cap p { margin: 0; color: var(--muted); font-size: 1rem; max-width: 40ch; }
.cap p + p { margin-top: 8px; }
.pasos { display: flex; gap: 5px; margin-top: 16px; }
.pasos i { flex: 1; height: 4px; border-radius: 2px; background: var(--line); }
.pasos i.hecho { background: var(--ink); }
.pasos i.ahora { background: var(--brick); }

.cap.hero { width: min(680px, calc(100vw - 32px)); padding: 26px 28px 28px; }
.cap.hero h2 { font-size: clamp(2.5rem, 8vw, 5.2rem); line-height: .95; letter-spacing: -.035em; margin-bottom: 14px; }
.cap.hero h2 em { font-style: normal; color: var(--brick); }
.cap.hero p { font-size: 1.1rem; }
.equipo { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; }
.equipo span { font-size: 13px; font-weight: 600; padding: 3px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--paper-2); }
.bajar { display: flex; align-items: center; gap: 10px; margin-top: 18px; font-size: 13px; font-weight: 600; color: var(--ink); letter-spacing: .02em; }
.bajar svg { width: 18px; height: 18px; animation: baja 1.6s ease-in-out infinite; }
@keyframes baja { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(5px); } }

.cap.fin { width: min(540px, calc(100vw - 32px)); padding: 26px 28px 28px; }
.boton { display: inline-flex; align-items: center; gap: 10px; margin-top: 18px; padding: 13px 20px; background: var(--ink); color: #fff; text-decoration: none; font-weight: 600; border-radius: 8px; transition: background .2s, transform .2s; }
.boton:hover { background: var(--brick); transform: translateY(-2px); }
.boton:focus-visible { outline: 3px solid var(--lib); outline-offset: 3px; }
.stack { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 18px; padding: 0; list-style: none; }
.stack li { font-size: 13px; font-weight: 600; padding: 3px 10px; border-radius: 4px; background: var(--paper-2); border: 1px solid var(--line); }
.nota { margin-top: 14px !important; font-size: 13px !important; }

/* ---- plan B sin WebGL ---- */
.sin-webgl #gl, .sin-webgl #track, .sin-webgl #nav, .sin-webgl #textos, .sin-webgl #barra { display: none; }
#plano-b { display: none; padding-block: 90px 48px; max-width: 980px; margin: 0 auto; }
.sin-webgl #plano-b { display: block; }
#plano-b h1 { font-family: var(--display); font-size: clamp(2rem, 6vw, 3.4rem); line-height: 1; letter-spacing: -.03em; margin: 0 0 12px; }
#plano-b .rejilla { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 18px; margin-top: 28px; }
#plano-b figure { margin: 0; min-width: 0; }
#plano-b img { width: 100%; border: 1px solid var(--line); border-radius: 8px; display: block; }
#plano-b figcaption { font-size: 14px; color: var(--muted); margin-top: 6px; }

@media (max-width: 640px) {
  .cap { padding: 16px 18px 18px; }
  .cap.hero { padding: 20px 20px 22px; }
  #nav button span { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .cap, .cap > * { transition: none !important; }
  .bajar svg, #pista .rueda { animation: none; }
}
</style>
